<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handmade Whiteboard (Excalidraw Engine)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Floating Toolbar -->
  <div class="top-toolbar">
    <div class="tool-group">
      <button class="btn-icon tool-btn" data-tool="select" title="Selection (V or 1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
        </svg>
        <span class="shortcut">1</span>
      </button>

      <button class="btn-icon tool-btn active" data-tool="rectangle" title="Rectangle (R or 2)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="18" height="18" rx="2" />
        </svg>
        <span class="shortcut">2</span>
      </button>

      <button class="btn-icon tool-btn" data-tool="rhombus" title="Rhombus / Diamond (D or 3)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polygon points="12,2 22,12 12,22 2,12" />
        </svg>
        <span class="shortcut">3</span>
      </button>

      <button class="btn-icon tool-btn" data-tool="circle" title="Handmade Circle / Ellipse (C or 4)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="9" />
        </svg>
        <span class="shortcut">4</span>
      </button>

      <button class="btn-icon tool-btn" data-tool="bullet" title="Bullet Point (B or 5)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="5" cy="12" r="2.5" fill="currentColor" />
          <line x1="11" y1="12" x2="20" y2="12" />
          <circle cx="5" cy="6" r="2.5" fill="currentColor" />
          <line x1="11" y1="6" x2="20" y2="6" />
          <circle cx="5" cy="18" r="2.5" fill="currentColor" />
          <line x1="11" y1="18" x2="20" y2="18" />
        </svg>
        <span class="shortcut">5</span>
      </button>

      <button class="btn-icon tool-btn" data-tool="text" title="Text (T or 6)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <polyline points="4 7 4 4 20 4 20 7" />
          <line x1="9" y1="20" x2="15" y2="20" />
          <line x1="12" y1="4" x2="12" y2="20" />
        </svg>
        <span class="shortcut">6</span>
      </button>
    </div>

    <div class="divider"></div>

    <div class="tool-group">
      <button class="btn-icon" id="btnUndo" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M3 10h10a5 5 0 0 1 5 5v2" />
          <polyline points="7 6 3 10 7 14" />
        </svg>
      </button>
      <button class="btn-icon" id="btnRedo" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M21 10H11a5 5 0 0 0-5 5v2" />
          <polyline points="17 6 21 10 17 14" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Left Properties Panel -->
  <div class="properties-panel">
    <!-- Stroke Color -->
    <div class="panel-section">
      <span class="panel-title">Stroke</span>
      <div class="color-picker">
        <div class="color-option active" data-type="stroke" data-color="#1e1e1e" style="background: #1e1e1e;" title="Black"></div>
        <div class="color-option" data-type="stroke" data-color="#e11d48" style="background: #e11d48;" title="Red"></div>
        <div class="color-option" data-type="stroke" data-color="#2563eb" style="background: #2563eb;" title="Blue"></div>
        <div class="color-option" data-type="stroke" data-color="#059669" style="background: #059669;" title="Green"></div>
        <div class="color-option" data-type="stroke" data-color="#d97706" style="background: #d97706;" title="Amber"></div>
        <div class="color-option" data-type="stroke" data-color="#7c3aed" style="background: #7c3aed;" title="Purple"></div>
      </div>
    </div>

    <!-- Background / Fill -->
    <div class="panel-section">
      <span class="panel-title">Fill</span>
      <div class="color-picker">
        <div class="color-option color-transparent active" data-type="fill" data-color="transparent" title="Transparent"></div>
        <div class="color-option" data-type="fill" data-color="#fecdd3" style="background: #fecdd3;" title="Pastel Pink"></div>
        <div class="color-option" data-type="fill" data-color="#bfdbfe" style="background: #bfdbfe;" title="Pastel Blue"></div>
        <div class="color-option" data-type="fill" data-color="#a7f3d0" style="background: #a7f3d0;" title="Pastel Green"></div>
        <div class="color-option" data-type="fill" data-color="#fde68a" style="background: #fde68a;" title="Pastel Yellow"></div>
        <div class="color-option" data-type="fill" data-color="#ddd6fe" style="background: #ddd6fe;" title="Pastel Purple"></div>
      </div>
    </div>

    <!-- Fill Style -->
    <div class="panel-section">
      <span class="panel-title">Fill Style</span>
      <div class="btn-group">
        <button class="choice-btn style-btn active" data-style="none">None</button>
        <button class="choice-btn style-btn" data-style="hachure">Hachure</button>
        <button class="choice-btn style-btn" data-style="solid">Solid</button>
      </div>
    </div>

    <!-- Stroke Width -->
    <div class="panel-section">
      <span class="panel-title">Stroke Width</span>
      <div class="btn-group">
        <button class="choice-btn width-btn" data-width="1">Thin</button>
        <button class="choice-btn width-btn active" data-width="2">Med</button>
        <button class="choice-btn width-btn" data-width="4">Bold</button>
      </div>
    </div>

    <!-- Roughness / Sloppiness -->
    <div class="panel-section">
      <span class="panel-title">Sloppiness</span>
      <div class="btn-group">
        <button class="choice-btn rough-btn" data-roughness="0.5" title="Architect (Clean)">Smooth</button>
        <button class="choice-btn rough-btn active" data-roughness="1.4" title="Handmade (Natural)">Artist</button>
        <button class="choice-btn rough-btn" data-roughness="2.4" title="Cartoonist (Rough)">Rough</button>
      </div>
    </div>
  </div>

  <!-- Top Right Actions -->
  <div class="action-panel">
    <button class="action-btn" id="btnClear" title="Clear entire whiteboard">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </svg>
      Clear
    </button>
    <button class="action-btn primary" id="btnExport" title="Export drawing as PNG">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="7 10 12 15 17 10" />
        <line x1="12" y1="15" x2="12" y2="3" />
      </svg>
      Export
    </button>
  </div>

  <!-- Canvas Stage -->
  <div id="canvasContainer">
    <canvas id="staticCanvas"></canvas>
    <canvas id="interactiveCanvas"></canvas>

    <!-- Floating Text Editor -->
    <div id="textOverlay">
      <textarea id="textEditor" rows="1" placeholder="Type here..."></textarea>
    </div>
  </div>

  <!-- Bottom Helper Badge -->
  <div class="info-badge">
    ✏️ Hand-drawn shape engine | Double-click text or bullet to edit | Del to remove
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
